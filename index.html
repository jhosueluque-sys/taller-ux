<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción al taller</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="tarjeta">
    <img src="img/banner.png" alt="Estudiantes programando en el laboratorio">
    <h1>Inscríbete al taller</h1>
    <p class="ayuda">Completa tus datos. Todos los campos son obligatorios.</p>
 
    <form id="formulario" novalidate>
      <fieldset>
        <legend>1. Tus datos</legend>
        <label for="nombre">Nombre completo</label>
        <input id="nombre" type="text" autocomplete="name" required>
 
        <label for="correo">Correo electrónico</label>
        <input id="correo" type="email" autocomplete="email"
               placeholder="nombre@tecsup.edu.pe" required>
 
        <label for="telefono">Celular</label>
        <input id="telefono" type="tel" placeholder="999 888 777" required>
      </fieldset>
 
      <fieldset>
        <legend>2. Tu taller</legend>
        <label for="taller">Elige un taller</label>
        <select id="taller" required>
          <option value="">Selecciona una opción</option>
          <optgroup label="Control de versiones">
            <option>Git</option> <option>GitHub</option> <option>Markdown</option>
          </optgroup>
          <optgroup label="Desarrollo web">
            <option>HTML</option> <option>CSS</option> <option>JavaScript</option>
            <option>React</option> <option>Node.js</option> <option>APIs</option>
          </optgroup>
          <optgroup label="Diseño y calidad">
            <option>Figma</option> <option>Accesibilidad</option> <option>Testing</option>
          </optgroup>
        </select>
      </fieldset>
 
      <p id="mensaje" class="mensaje" role="status"></p>
 
      <div class="acciones">
        <button type="submit" class="boton-principal">Inscribirme</button>
        <button type="reset" class="boton-secundario">Limpiar formulario</button>
      </div>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
